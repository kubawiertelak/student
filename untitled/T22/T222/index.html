<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obliczanie Potęgi</title>
  <link href="style.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .result {
      margin-top: 20px;
      font-weight: bold;
      color: blue;
    }
    .error {
      margin-top: 20px;
      color: red;
    }
  </style>
</head>
<body>
<header>
  <h1>Zadania 223</h1>
  <h2>Autor: Jakub Wiertelak kl.2p</h2>
  <hr>
</header>
<section>
  <p>Napisz funkcję, której wynikiem będzie podniesienie wartości przekazanego jej argumentu do potęgi przekazanej również jako argument. Funkcja zwraca wartość i wyświetla wynik w postaci (np. dla wartości 2 i 3):<br>

    x = 2<br>
    y = 3<br>
    xy=23=8</p>
<label for="base">Podstawa (x):</label>
<input type="number" id="base" placeholder="Podaj podstawę">
<br><br>
<label for="exponent">Wykładnik (y):</label>
<input type="number" id="exponent" placeholder="Podaj wykładnik">
<br><br>
<button onclick="calculatePower()">Oblicz</button>
<div id="output" class="result"></div>
<div id="error" class="error"></div>
</section>
<script>
  function calculatePower() {
    // Pobierz dane z pól
    const base = document.getElementById('base').value;
    const exponent = document.getElementById('exponent').value;
    const output = document.getElementById('output');
    const error = document.getElementById('error');

    // Wyczyść poprzednie wyniki
    output.textContent = '';
    error.textContent = '';

    // Sprawdź, czy dane są poprawne
    if (base === '' || exponent === '') {
      error.textContent = 'Proszę wypełnić oba pola.';
      return;
    }

    // Zamień dane na liczby
    const x = parseFloat(base);
    const y = parseFloat(exponent);

    // Sprawdź, czy dane są liczbami
    if (isNaN(x) || isNaN(y)) {
      error.textContent = 'Wprowadź poprawne liczby.';
      return;
    }

    // Oblicz wynik
    const result = Math.pow(x, y);

    // Wyświetl wynik
    output.textContent = `x = ${x}, y = ${y}, ${x}^${y} = ${result}`;
  }
</script>
</body>
</html>
